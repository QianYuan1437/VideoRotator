name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.3'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="VideoRotator-${GITHUB_REF_NAME}"
          else
            NAME="VideoRotator-build-${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}.apk"
          echo "ASSET_NAME=${NAME}.apk" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/*.apk

      - name: Publish Release (tag -> formal release)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "VideoRotator $GITHUB_REF_NAME" \
              --notes "正式版本 $GITHUB_REF_NAME。Android 横屏视频转竖屏（纯旋转 90°，无裁切、无重编码）。"
          fi

      - name: Publish rolling pre-release (main -> latest build)
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "latest" > /dev/null 2>&1; then
            gh release upload "latest" dist/*.apk --clobber
          else
            gh release create "latest" dist/*.apk \
              --prerelease \
              --title "Latest Build" \
              --notes "main 分支最新自动构建（预发布）。正式版本请查看带 v* 标签的 Release。"
          fi
