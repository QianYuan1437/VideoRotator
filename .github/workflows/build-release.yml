name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.3'

      # 直接使用仓库内固定签名的 keystore；不在 CI 上每次都重新生成，
      # 确保前后版本签名一致，「检查更新」可覆盖安装。

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="VideoRotator-${GITHUB_REF_NAME}"
          else
            NAME="VideoRotator-build-${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}.apk"
          echo "ASSET_NAME=${NAME}.apk" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/*.apk

      - name: Publish Release (tag -> formal release)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release Notes 改用当前 tag 指向的 commit message（commit message
          # 已详列本版本的修复内容），不再使用固定文案。
          NOTES=$(git log -1 --format='%B' "$GITHUB_REF_NAME")
          echo "$NOTES" > /tmp/release-notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "VideoRotator $GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Publish rolling pre-release (main -> latest build)
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 预发布说明也用最近一次提交的消息，便于查看每次 main 构建带的内容
          NOTES=$(git log -1 --format='%B' "$GITHUB_SHA")
          echo "$NOTES" > /tmp/release-notes.md
          if gh release view "latest" > /dev/null 2>&1; then
            # 删除历史构建资产，只保留本次产物，避免用户下载到过期 APK
            gh release view "latest" --json assets --jq '.assets[].name' \
              | grep '^VideoRotator-build-.*\.apk$' | while read -r old; do
                  gh release delete-asset "latest" "$old" --yes || true
                done
            gh release upload "latest" dist/*.apk --clobber
            gh release edit "latest" --notes-file /tmp/release-notes.md
          else
            gh release create "latest" dist/*.apk \
              --prerelease \
              --title "Latest Build" \
              --notes-file /tmp/release-notes.md
          fi
